name: Zoo My Block Lab Tests
on:
  push:
    branches:
      - autonomous-engine-replacement-2026-10-29
    paths:
      - 'engine/dashboard/labs/myblock/**'
      - '.github/workflows/zoo-myblock-lab-tests.yml'
  pull_request:
    paths:
      - 'engine/dashboard/labs/myblock/**'
  workflow_dispatch:
jobs:
  synthetic-lab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run My Block lab regression tests
        run: node --test engine/dashboard/labs/myblock/logic.test.mjs
