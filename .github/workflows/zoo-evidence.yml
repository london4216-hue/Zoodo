name: Zoo evidence heartbeat
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [autonomous-engine-replacement-2026-10-29]
permissions:
  contents: write
concurrency:
  group: zoo-evidence-heartbeat
  cancel-in-progress: false
jobs:
  evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autonomous-engine-replacement-2026-10-29
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect real GitHub evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZOO_REPO: ${{ github.repository }}
        run: python3 engine/verification/collect_evidence.py
      - name: Publish evidence only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/dashboard/evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(zoo): publish observed evidence [skip ci]"
            git push
          fi
