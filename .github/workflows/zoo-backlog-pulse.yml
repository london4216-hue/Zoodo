name: ZOO baseline - live backlog pulse

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: zoo-backlog-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Diagnostic smoke
        shell: bash
        run: |
          set -euo pipefail
          echo "=== baseline diagnostic ==="
          echo "Runner: $RUNNER_OS"
          echo "Event: ${GITHUB_EVENT_NAME:-unknown}"
          echo "Ref: ${GITHUB_REF:-unknown}"
          python3 --version
          echo "=== end diagnostic ==="

      - name: Count live PRs, bug fixes and build tickets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "zoo-backlog-pulse",
          }
          stamp = datetime.datetime.now(datetime.timezone.utc).isoformat()
          payload = {
              "observed_at_utc": stamp,
              "repository": repo,
              "execution_status": "OBSERVATION_FAILED",
              "agent_dispatch_verified": False,
              "counts_complete": False,
          }

          def pages(endpoint):
              results = []
              url = "https://api.github.com/repos/" + repo + "/" + endpoint
              params = urllib.parse.urlencode({"state": "open", "per_page": 100, "page": 1})
              url += "?" + params
              for page in range(1, 101):
                  response = None
                  for attempt in range(3):
                      try:
                          request = urllib.request.Request(url, headers=headers)
                          response = urllib.request.urlopen(request, timeout=20)
                          break
                      except urllib.error.HTTPError as error:
                          if error.code not in (429, 500, 502, 503, 504) and not (
                              error.code == 403 and error.headers.get("Retry-After")
                          ):
                              raise
                          if attempt == 2:
                              raise
                          time.sleep(min(int(error.headers.get("Retry-After", "2") or "2"), 10))
                      except (urllib.error.URLError, TimeoutError):
                          if attempt == 2:
                              raise
                          time.sleep(2 * (attempt + 1))
                  with response:
                      batch = json.load(response)
                      link = response.headers.get("Link", "")
                  if not isinstance(batch, list):
                      raise RuntimeError("GitHub returned a non-list response")
                  results.extend(batch)
                  next_links = [part for part in link.split(",") if 'rel="next"' in part]
                  if not next_links:
                      return results
                  if page == 100:
                      raise RuntimeError("Pagination exceeded 100 pages; refusing partial counts")
                  url = next_links[0].strip().split(";")[0].strip().strip("<>")
              raise RuntimeError("Pagination did not complete")

          try:
              prs = pages("pulls")
              issues = [item for item in pages("issues") if "pull_request" not in item]
              def is_bug(item):
                  labels = [label["name"].lower() for label in item.get("labels", [])]
                  return any("bug" in label or "fix" in label for label in labels)
              bugs = [item for item in issues if is_bug(item)]
              payload.update({
                  "open_prs": len(prs),
                  "open_bug_fix_tickets": len(bugs),
                  "open_other_tickets": len(issues) - len(bugs),
                  "open_total_issues": len(issues),
                  "classification": "bug/fix label; other issues classified as other",
                  "execution_status": "BACKLOG_OBSERVED_ONLY",
                  "counts_complete": True,
              })
          except Exception as error:
              payload["error"] = str(error)
          finally:
              with open("zoo-pulse.json", "w") as file:
                  json.dump(payload, file, indent=2)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as file:
                  file.write("## ZOO backlog pulse — " + stamp + "\n\n")
                  file.write("**Status:** " + payload["execution_status"] + "\n\n")
                  if payload["counts_complete"]:
                      file.write("| Work class | Open |\n|---|---:|\n")
                      for label, key in [
                          ("PRs", "open_prs"),
                          ("Bug/fix issues", "open_bug_fix_tickets"),
                          ("Other issues", "open_other_tickets"),
                      ]:
                          file.write("| " + label + " | " + str(payload[key]) + " |\n")
                  else:
                      file.write("Counts unavailable: " + payload.get("error", "unknown") + "\n")
                  file.write("\nNo agent dispatch, commit, or merge is implied.\n")
              print(json.dumps(payload))
          if not payload["counts_complete"]:
              raise SystemExit(1)
          PY

      - name: Upload pulse artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoo-pulse
          path: zoo-pulse.json
          retention-days: 14
          if-no-files-found: warn
