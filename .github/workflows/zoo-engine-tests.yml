name: Zoo engine unit tests
on:
  push:
    branches:
      - 'zoo/**'
      - 'autonomous-engine-replacement-*'
    paths:
      - 'engine/**'
      - '.github/workflows/zoo-engine-tests.yml'
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/zoo-engine-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated engine unit tests
        run: npm test
